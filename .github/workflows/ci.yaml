name: IRIS CI Pipeline

# TASK 4: Enable CI on Every Push & PR
on:
  push:
    branches: [ "**" ] # Runs on all branches
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # CRITICAL: These permissions are required for Workload Identity Federation to work!
    # It allows GitHub to generate the temporary OIDC token to hand to Google.
    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Download the repository code into the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up a Python environment
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # You can adjust this to match your local version

      # Step 3: Install all required Python libraries
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas scikit-learn joblib dvc dvc-gs

      # Step 4: Authenticate to Google Cloud using WIF (Keyless!)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      # Step 5: TASK 3 - Pull data and models from GCP Bucket
      - name: DVC Pull Data and Model
        run: |
          dvc pull

      # Step 6: Setup CML (Continuous Machine Learning)
      - name: Setup CML
        uses: iterative/setup-cml@v2

      # Step 7: TASK 5 - Run Pytest, capture output, and post CML report
      - name: Run Pytest and Publish CML Report
        env:
          # CML needs the default GitHub token to have permission to write a comment
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Create the markdown report header
          echo "# 📊 Pipeline Evaluation Report" > report.md
          echo "Here are the results of the automated data and model validation tests:" >> report.md
          echo "" >> report.md
          
          # 2. Run Pytest and pipe the output into the markdown report inside a code block
          echo "\`\`\`text" >> report.md
          pytest tests/ -v >> report.md
          echo "\`\`\`" >> report.md
          
          # 3. Tell CML to post the report as a comment!
          cml comment create report.md