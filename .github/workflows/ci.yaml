name: LLMOps CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master", "week_10" ]

jobs:
  llm-eval-and-test:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Updated dependencies for LLMs
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas scikit-learn dvc dvc-gs transformers torch

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: DVC Pull Data
        run: |
          dvc pull

      # NEW: We must pull the model weights into the CI runner
      - name: Download Gemma Checkpoints from GCS
        run: |
          mkdir -p models/v1_raw models/v2_desc
          echo "Downloading V1 Model..."
          gsutil -m cp -r "gs://mlops-course-project-d5c04e1d-be23-4954-84c-week-10/fine-tuning/raw-model/postprocess/node-0/checkpoints/final/*" models/v1_raw/
          echo "Downloading V2 Model..."
          gsutil -m cp -r "gs://mlops-course-project-d5c04e1d-be23-4954-84c-week-10/fine-tuning/desc-model/postprocess/node-0/checkpoints/final/*" models/v2_desc/

      - name: Setup CML
        uses: iterative/setup-cml@v2

      # Run the LLM Evaluation script and catch regressions
      - name: Run LLM Evaluation and Publish CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# 🤖 LLMOps Evaluation Report" > report.md
          echo "Automated CI check for Gemma-3-1b format compliance and accuracy:" >> report.md
          echo "" >> report.md
          
          echo "\`\`\`text" >> report.md
          # Run the evaluation script. If sys.exit(1) is triggered, this step fails.
          python llm_eval.py >> report.md 2>&1
          echo "\`\`\`" >> report.md
          
          cml comment create report.md