name: LLM Governance CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master", "week_10", "week_11" ] # Added week_11

jobs:
  governance-eval:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
    - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas scikit-learn dvc dvc-gs transformers torch tabulate

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: DVC Pull Data
        run: |
          dvc pull

      - name: Download Gemma Checkpoints from GCS
        run: |
          mkdir -p models/v1_raw models/v2_desc
          echo "Downloading V1 Model..."
          gcloud storage cp -r "gs://mlops-course-project-d5c04e1d-be23-4954-84c-week-10/fine-tuning/raw-model/postprocess/node-0/checkpoints/final/*" models/v1_raw/
          echo "Downloading V2 Model..."
          gcloud storage cp -r "gs://mlops-course-project-d5c04e1d-be23-4954-84c-week-10/fine-tuning/desc-model/postprocess/node-0/checkpoints/final/*" models/v2_desc/

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Run Governance Checks and Publish CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# 🛡️ LLM Governance & Guardrails Report" > report.md
          echo "Automated CI check for Prompt Injection, Leakage, and Usability:" >> report.md
          echo "" >> report.md
          
          echo "\`\`\`text" >> report.md
          # Execute the guarded pipeline evaluation
          python guarded_pipeline_eval.py >> report.md 2>&1
          echo "\`\`\`" >> report.md
          
          cml comment create report.md