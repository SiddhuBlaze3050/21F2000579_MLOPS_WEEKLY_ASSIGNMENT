name: IRIS Continuous Deployment

on:
  push:
    branches: [ "week_6" ]

env:
  GCP_PROJECT_ID: "project-d5c04e1d-be23-4954-84c" # <--- Explicitly define your GCP Project ID here
  REGION: "us-central1"
  REPO_NAME: "my-repo"
  IMAGE_NAME: "iris-api"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK and Docker Auth
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg MLFLOW_TRACKING_URI="https://${{ secrets.DAGSHUB_USERNAME }}:${{ secrets.DAGSHUB_TOKEN }}@dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/21F2000579_MLOPS_WEEKLY_ASSIGNMENT.mlflow" \
            --build-arg MLFLOW_TRACKING_USERNAME="${{ secrets.DAGSHUB_USERNAME }}" \
            --build-arg MLFLOW_TRACKING_PASSWORD="${{ secrets.DAGSHUB_TOKEN }}" \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest .
          
      - name: Push Docker Image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest
          
      # Step 6: Deploy to Google Kubernetes Engine
      - name: Install GKE Auth Plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y google-cloud-sdk-gke-gcloud-auth-plugin
      
      - name: Deploy to GKE
        run: |
          # Connect to the cluster
          gcloud container clusters get-credentials test-iris-v1 --zone us-central1-c --project ${{ env.GCP_PROJECT_ID }}
          
          # Apply the manifests
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          
          # Force a restart to ensure Kubernetes pulls the absolute latest image tag
          kubectl rollout restart deployment/iris-api-deployment