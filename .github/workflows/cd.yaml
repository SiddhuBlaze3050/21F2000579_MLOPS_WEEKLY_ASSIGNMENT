name: IRIS Continuous Deployment

on:
  push:
    branches: [ "week_6" ]

env:
  GCP_PROJECT_ID: "project-d5c04e1d-be23-4954-84c" # <--- Explicitly define your GCP Project ID here
  REGION: "us-central1"
  REPO_NAME: "my-repo"
  IMAGE_NAME: "iris-api"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK and Docker Auth
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg MLFLOW_TRACKING_URI="https://${{ secrets.DAGSHUB_USERNAME }}:${{ secrets.DAGSHUB_TOKEN }}@dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/21F2000579_MLOPS_WEEKLY_ASSIGNMENT.mlflow" \
            --build-arg MLFLOW_TRACKING_USERNAME="${{ secrets.DAGSHUB_USERNAME }}" \
            --build-arg MLFLOW_TRACKING_PASSWORD="${{ secrets.DAGSHUB_TOKEN }}" \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest .
          
      - name: Push Docker Image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest
          
    # Step 6: Authenticate with GKE (Automatically installs gke-gcloud-auth-plugin!)
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: 'test-iris-v1'
          location: 'us-central1-c'
          project_id: '${{ env.GCP_PROJECT_ID }}'

      # Step 7: Deploy Manifests to GKE
      - name: Deploy to GKE
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout restart deployment/iris-api-deployment